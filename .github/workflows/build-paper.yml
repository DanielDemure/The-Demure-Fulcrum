name: Build and validate working paper

on:
  push:
    branches:
      - main
    paths:
      - "paper/**"
      - "references/**"
      - "research/**"
      - "applications/**"
      - "assets/**"
      - "provenance/**"
      - "reviews/**"
      - "scripts/**"
      - "tests/**"
      - "README.md"
      - "CITATION.cff"
      - "LICENSE"
      - "CHANGELOG.md"
      - "REVIEW_GUIDE.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/build-paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "references/**"
      - "research/**"
      - "applications/**"
      - "assets/**"
      - "provenance/**"
      - "reviews/**"
      - "scripts/**"
      - "tests/**"
      - "README.md"
      - "CITATION.cff"
      - "LICENSE"
      - "CHANGELOG.md"
      - "REVIEW_GUIDE.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

concurrency:
  group: build-paper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run validator regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Install PDF and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pyyaml pypdf
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Build PDF from Markdown and BibTeX
        run: python scripts/build_pdf.py

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Upload reproducible PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: demure-fulcrum-working-paper
          path: paper/The_Demure_Fulcrum_Academic_Paper.pdf
          if-no-files-found: error

      - name: Commit regenerated PDF on branch pushes
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/The_Demure_Fulcrum_Academic_Paper.pdf
          if git diff --cached --quiet; then
            echo "PDF is already current."
          else
            git commit -m "build: regenerate working-paper PDF [skip ci]"
            git push
          fi
