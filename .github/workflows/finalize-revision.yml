name: Finalize Demure Fulcrum revision

on:
  push:
    branches:
      - revision/agency-meta-response
    paths:
      - ".github/workflows/finalize-revision.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pyyaml pypdf
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Remove superseded research documents
        run: |
          rm -f research/01_psychological_foundations.md
          rm -f research/02_philosophical_evolutionary.md
          rm -f research/03_cultural_manifestations.md

      - name: Build current PDF
        run: python scripts/build_pdf.py

      - name: Validate final repository snapshot
        run: python scripts/validate_repo.py

      - name: Commit generated PDF and deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Revision snapshot already final."
          else
            git commit -m "build: finalize reconstructed working paper [skip ci]"
            git push
          fi
