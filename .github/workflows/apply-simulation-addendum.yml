name: Apply simulation addendum

on:
  push:
    branches:
      - revision/simulation-protocol-and-banner
    paths:
      - ".github/migrations/apply_simulation_addendum.py"
      - ".github/workflows/apply-simulation-addendum.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: revision/simulation-protocol-and-banner
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate migration markers and outputs
        run: python .github/migrations/apply_simulation_addendum.py --check

      - name: Apply simulation addendum
        run: python .github/migrations/apply_simulation_addendum.py

      - name: Install PDF and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pyyaml pypdf
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build updated working-paper PDF
        run: python scripts/build_pdf.py

      - name: Validate complete repository
        run: python scripts/validate_repo.py

      - name: Commit integrated source and PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            paper/The_Demure_Fulcrum_Academic_Paper.md \
            paper/The_Demure_Fulcrum_Academic_Paper.pdf \
            research/01_threat_response_and_regulation.md \
            research/02_construct_and_formal_model.md \
            applications/hexure.md \
            reviews/2026-08-08-external-review-response.md \
            references/references.bib
          git status --short
          git commit -m "docs: integrate simulation protocol addendum"
          git push
