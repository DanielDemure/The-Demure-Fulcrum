name: Apply August 2026 external review

on:
  push:
    branches:
      - revision/2026-review-integration
    paths:
      - ".github/migrations/apply_review_integration.py"
      - ".github/workflows/apply-review-integration.yml"
      - "assets/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/migrations/apply_review_integration.py"
      - ".github/workflows/apply-review-integration.yml"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review-integration branch
        uses: actions/checkout@v4
        with:
          ref: revision/2026-review-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scope claim preflight to substantive documents
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/migrations/apply_review_integration.py')
          text = path.read_text(encoding='utf-8')
          old = '    combined = "\\n".join(changes.values()).lower()\n'
          new = '''    substantive_paths = (\n        "paper/The_Demure_Fulcrum_Academic_Paper.md",\n        "research/02_construct_and_formal_model.md",\n        "research/03_cultural_and_philosophical_illustrations.md",\n        "applications/hexure.md",\n        "README.md",\n    )\n    combined = "\\n".join(changes[rel] for rel in substantive_paths).lower()\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected claim-scan statement not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate migration inputs and outputs
        run: python .github/migrations/apply_review_integration.py --check

      - name: Apply review integration
        run: python .github/migrations/apply_review_integration.py

      - name: Install PDF and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pyyaml pypdf
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build updated working-paper PDF
        run: python scripts/build_pdf.py

      - name: Validate complete repository
        run: python scripts/validate_repo.py

      - name: Remove one-time migration machinery
        run: |
          rm -f .github/migrations/apply_review_integration.py
          rm -f .github/workflows/apply-review-integration.yml
          rmdir .github/migrations 2>/dev/null || true

      - name: Commit integrated review and generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "docs: integrate August 2026 external review"
          git push
